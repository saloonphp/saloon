name: Code Style

on:
  push:
    branches:
      - 'v1'
      - 'v2'
      - 'v3'
  pull_request:
    branches:
      - '*'

permissions:
  contents: write

concurrency:
  group: ${{ github.head_ref || github.ref || github.run_id }}_php_cs_fixer
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run PHP CS Fixer
        run: ./vendor/bin/php-cs-fixer fix --allow-risky=yes

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: 🪄 Code Style Fixes
          commit_options: '--no-verify'
