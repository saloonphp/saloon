name: PHPStan

on:
  push:
    branches:
      - 'v1'
      - 'v2'
      - 'v3'
      - 'v4'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.head_ref || github.ref || github.run_id }}_phpstan
  cancel-in-progress: true

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@1919f6c305aea6ab10e6181a8ddf72317ad77e0e # 2.3.1

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github
